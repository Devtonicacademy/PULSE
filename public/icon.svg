<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4757" />
      <stop offset="50%" stop-color="#FFA502" />
      <stop offset="100%" stop-color="#FF4757" />
    </linearGradient>
    <linearGradient id="radarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Outer radar rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#radarRing)" stroke-width="2.5" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255, 71, 87, 0.25)" stroke-width="2" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />

  <!-- Glowing Pulse Radar Pin / Heartbeat -->
  <g filter="url(#glow)">
    <!-- Main Location Pin with Heartbeat Wave inside -->
    <path d="M256 96 C180 96 118 158 118 234 C118 322 230 408 245 422 C251 427 261 427 267 422 C282 408 394 322 394 234 C394 158 332 96 256 96 Z" 
          fill="url(#pulseGrad)" />
    
    <!-- Inner Dark Circle Cutout -->
    <circle cx="256" cy="234" r="76" fill="#0A0E17" />
    
    <!-- Inner Heartbeat / Pulse EKG wave -->
    <path d="M206 234 L232 234 L244 204 L256 264 L268 214 L278 234 L306 234" 
          fill="none" 
          stroke="#00F2FE" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
