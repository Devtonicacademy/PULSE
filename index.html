<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E17" />
    <meta name="description" content="PULSE — Never miss what's happening nearby. Real-time location-based social discovery." />

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PULSE" />

    <!-- Fonts & Map styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Apply the saved or browser theme before first paint, so light mode never flashes dark -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pulse-theme');
          var pref = saved === 'light' || saved === 'dark' ? saved : 'system';
          var dark = pref === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0A0E17' : '#F4F6FA');
        } catch (e) {}
      })();
    </script>

    <title>PULSE — Never miss what's happening nearby</title>
  </head>
  <body class="bg-[#0A0E17] text-slate-100 antialiased selection:bg-accent-500/30 selection:text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
